name: Nimbus
options:
  bundleIdPrefix: com.irenapoghosyan
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G6AA4T82BJ

packages:
  NimbusKit:
    path: Packages/NimbusKit

targets:
  Nimbus:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: NimbusWidgets
      - package: NimbusKit
        product: WeatherCore
      - package: NimbusKit
        product: OpenMeteo
      - package: NimbusKit
        product: LocationKit
      - package: NimbusKit
        product: DesignSystem
      - package: NimbusKit
        product: WeatherFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nimbus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: Nimbus uses your location to show the weather where you are. Only approximate coordinates (about 1 km) are sent to the weather service.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Widgets open their city with nimbus://place?code=…
        CFBundleURLTypes:
          - CFBundleURLName: com.irenapoghosyan.nimbus
            CFBundleURLSchemes: [nimbus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.nimbus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Home Screen and Lock Screen widgets. Reuses the app's modules; only the wiring lives here.
  # No App Group is needed: each widget keeps its own city.
  NimbusWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: NimbusKit
        product: WeatherCore
      - package: NimbusKit
        product: OpenMeteo
      - package: NimbusKit
        product: DesignSystem
      - package: NimbusKit
        product: WidgetFeature
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nimbus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.nimbus.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Nimbus:
    build:
      targets:
        Nimbus: all
    # ⌘U on the app scheme runs every module's tests.
    test:
      gatherCoverageData: true
      targets:
        - package: NimbusKit/WeatherCoreTests
        - package: NimbusKit/OpenMeteoTests
        - package: NimbusKit/LocationKitTests
        - package: NimbusKit/DesignSystemTests
        - package: NimbusKit/WeatherFeatureTests
        - package: NimbusKit/WidgetFeatureTests

  # Running this scheme puts the widget straight onto the simulator's Home Screen.
  # Change _XCWidgetFamily to systemMedium or accessoryRectangular to see the other sizes.
  NimbusWidgets:
    build:
      targets:
        NimbusWidgets: all
        Nimbus: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: WeatherWidget
        _XCWidgetFamily: systemSmall
        _XCWidgetDefaultView: timeline
